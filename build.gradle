plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.16-SNAPSHOT' apply false
    id "com.replaymod.preprocess" version "c5abb4fb12"
}

preprocess {
    strictExtraMappings = false

    def mc12100 = createNode("1.21", 1_21_00, "")
    def mc12105 = createNode("1.21.5", 1_21_05, "")
    def mc12106 = createNode("1.21.6", 1_21_06, "")
    def mc12111 = createNode("1.21.11", 1_21_11, "")
    def mc260100 = createNode("26.1", 26_01_00, "")

    mc12105.link(mc12100, null)
    mc12106.link(mc12105, null)
    mc12111.link(mc12106, null)
    mc260100.link(mc12111, null)

    for (final def node in getNodes()) {
        findProject(node.project).ext.mcVersion = node.mcVersion
    }
}

tasks.register('collectJars') {
    group = 'build'
    description = 'Run publish on all subprojects, collect bytecode jars into build/lib, and delete source jars'

    subprojects.each { sp ->
        dependsOn "${sp.path}:publish"
    }

    doLast {
        def libDir = file("${layout.buildDirectory.get().asFile}/lib")
        libDir.mkdirs()

        subprojects.each { subproject ->
            def buildLibsDir = file("${subproject.projectDir}/build/libs")
            if (buildLibsDir.exists()) {
                def jars = fileTree(buildLibsDir).include('**/*.jar')

                jars.each { jar ->
                    if (jar.name.endsWith('-sources.jar')) {
                        jar.delete()
                    } else {
                        project.copy {
                            from jar
                            into libDir
                        }
                    }
                }
            }
        }
    }
}